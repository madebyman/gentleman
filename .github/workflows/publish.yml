name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (e.g. edge, 0.1.0)'
        required: false
        default: edge

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: image=moby/buildkit:latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Scan before anything is pushed: build amd64 only and load it into the
      # runner's Docker (a multi-platform build cannot be loaded). The real
      # build below reuses this builder's cache. arm64 carries the same
      # package versions, so amd64 stands for both.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gentleman:scan
          cache-from: type=registry,ref=ghcr.io/madebyman/gentleman:buildcache

      # Report: fixable CRITICAL / HIGH into the step summary. Never fails.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gentleman:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: trivy summary
        if: always()
        run: |
          {
            echo '### Trivy (fixable, CRITICAL / HIGH)'
            echo '```'
            cat trivy.txt 2>/dev/null || echo '(no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate: any fixable CRITICAL stops the publish. HIGH is reported only,
      # since some of it (e.g. npm's bundled dependencies) cannot be fixed here.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gentleman:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/madebyman/gentleman:buildcache
          cache-to: type=registry,ref=ghcr.io/madebyman/gentleman:buildcache,mode=min
