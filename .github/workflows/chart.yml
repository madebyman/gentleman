name: chart

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target OCI repository'
        type: choice
        options:
          - sandbox
          - charts
        default: sandbox
      version:
        description: 'Chart version (blank = use Chart.yaml)'
        required: false
        default: ''
      push:
        description: 'Push to ghcr (unchecked = package and inspect only)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CHART_DIR: charts/gentleman

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: resolve version
        run: |
          CHART_VERSION=$(helm show chart "$CHART_DIR" | awk '/^version:/{print $2}')
          APP_VERSION=$(helm show chart "$CHART_DIR" | awk '/^appVersion:/{print $2}' | tr -d '"')
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$CHART_VERSION}"

          echo "VERSION=$VERSION"         >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          {
            echo "| | |"
            echo "|---|---|"
            echo "| chart version | \`$VERSION\` |"
            echo "| appVersion | \`$APP_VERSION\` |"
            echo "| target | \`oci://ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}\` |"
            echo "| push | \`${{ inputs.push }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verify image exists
        run: |
          TOKEN=$(curl -sf -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$APP_VERSION")

          if [ "$CODE" != "200" ]; then
            echo "::error file=$CHART_DIR/Chart.yaml::appVersion $APP_VERSION has no image on ghcr (HTTP $CODE) - run the publish workflow first"
            exit 1
          fi

      - run: helm lint "$CHART_DIR"

      - name: render
        run: |
          # defaults: built-in example agent
          helm template gentleman "$CHART_DIR" > /dev/null

          # secrets
          helm template gentleman "$CHART_DIR" --set secrets.existingSecret=x > /dev/null
          helm template gentleman "$CHART_DIR" --set secrets.create=true --set secrets.data.FOO=bar > /dev/null
          ! helm template gentleman "$CHART_DIR" --set secrets.data.FOO=bar > /dev/null 2>&1

          # agents
          helm template gentleman "$CHART_DIR" --set-json 'agents={"mine":{"agent.yaml":{"model":"gentleman:echo"}}}' > /dev/null
          helm template gentleman "$CHART_DIR" --set-json 'agents={"mine":{"agent.yaml":{"model":"gentleman:echo"},"mcp_config.json":{"mcpServers":{}}}}' > /dev/null
          helm template gentleman "$CHART_DIR" --set-json 'agents={"far":{"a2a.yaml":{"url":"https://far.example.com/a2a/far"}}}' > /dev/null
          helm template gentleman "$CHART_DIR" --set existingAgents.mine=my-agent > /dev/null
          ! helm template gentleman "$CHART_DIR" --set-json 'agents={"mine":{"agent.yaml":{"model":"gentleman:echo"}}}' --set existingAgents.mine=x > /dev/null 2>&1
          ! helm template gentleman "$CHART_DIR" --set-json 'agents={".hidden":{"agent.yaml":{"model":"gentleman:echo"}}}' > /dev/null 2>&1
          ! helm template gentleman "$CHART_DIR" --set-json 'agents={"mine":{"agent.yml":{"model":"gentleman:echo"}}}' > /dev/null 2>&1
          ! helm template gentleman "$CHART_DIR" --set-json 'agents={"mine/agent.yaml":{"model":"gentleman:echo"}}' > /dev/null 2>&1
          helm template gentleman "$CHART_DIR" --set defaultAgents=null \
            --set-json 'extraVolumes=[{"name":"x","emptyDir":{}}]' \
            --set-json 'extraVolumeMounts=[{"name":"x","mountPath":"/x"}]' > /dev/null

      - name: package
        run: helm package "$CHART_DIR" --version "$VERSION" -d dist

      - name: inspect
        run: |
          echo '--- files in the package'
          tar tzf "dist/gentleman-$VERSION.tgz"
          echo '--- renders from the package'
          helm template gentleman "dist/gentleman-$VERSION.tgz" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/

      - name: push
        if: inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          OUT=$(helm push "dist/gentleman-$VERSION.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}" 2>&1) \
            || { echo "$OUT"; exit 1; }
          echo "$OUT"
          DIGEST=$(echo "$OUT" | awk '/^Digest:/{print $2}')
          if [ -z "$DIGEST" ]; then
            echo "::error::helm push printed no digest - refusing to sign by tag"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        if: inputs.push

      - name: sign
        if: inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          REF="ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}/gentleman@$DIGEST"
          cosign sign --yes "$REF"
          echo "| signed | \`$REF\` |" >> "$GITHUB_STEP_SUMMARY"


