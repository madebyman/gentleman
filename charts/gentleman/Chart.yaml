  artifacthub.io/links: |
    - name: source
      url: https://github.com/madebyman/gentleman
    - name: support
      url: https://github.com/madebyman/gentleman/issues
  artifacthub.io/images: |
    - name: gentleman
      image: ghcr.io/madebyman/gentleman:0.4.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: changed
      description: "agents is keyed by agent name, one ConfigMap per agent (breaking)"
    - kind: changed
      description: "agentsExistingConfigMap is replaced by existingAgents (breaking)"
    - kind: added
      description: "mcp_config.json and a2a.yaml can be declared in agents"
    - kind: added
      description: "startupProbe, so slow MCP servers are not restarted during startup"
    - kind: fixed
      description: "readinessProbe uses /ready"
    - kind: fixed
      description: "appVersion 0.4.1: the image runs as uid/gid 1000, matching runAsUser, so stdio MCP servers can write $HOME"

