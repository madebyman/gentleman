{{- $agents := include "gentleman.agents" . | fromYaml }}
{{- range $name, $files := $agents }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gentleman.agentConfigMapName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gentleman.labels" $ | nindent 4 }}
  annotations:
    gentleman/agent: {{ $name | quote }}
data:
  {{- range $file, $body := $files }}
  {{ $file }}: |
    {{- if hasSuffix ".json" $file }}
    {{- toPrettyJson $body | nindent 4 }}
    {{- else }}
    {{- toYaml $body | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
