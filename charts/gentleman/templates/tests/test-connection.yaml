apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gentleman.fullname" . }}-test-connection"
  labels:
    {{- include "gentleman.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '-q'
        - '-O'
        - '-'
        - 'http://{{ include "gentleman.fullname" . }}:{{ .Values.service.port }}/health'
  restartPolicy: Never
