{{- $agents := include "gentleman.agents" . | fromYaml }}
{{- $existing := .Values.existingAgents | default dict }}
{{- range $name, $_ := $existing }}
{{- if hasKey $agents $name }}
{{- fail (printf "agent %q is defined in both agents and existingAgents" $name) }}
{{- end }}
{{- end }}
{{- $mountAgents := or $agents $existing }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentleman.fullname" . }}
  labels:
    {{- include "gentleman.labels" . | nindent 4 }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "gentleman.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        checksum/agents: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gentleman.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gentleman.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          env:
          - name: GENTLEMAN_APP_AGENTS_DIR
            value: {{ .Values.agentsMountPath | quote }}
          - name: GENTLEMAN_APP_ORIGIN
            value: {{ include "gentleman.appOrigin" . | quote }}
          {{- range $k, $v := .Values.env }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 10 }}
          {{- end }}

          {{- if or .Values.secrets.existingSecret (and .Values.secrets.create .Values.secrets.data) }}
          envFrom:
          - secretRef:
              name: {{ include "gentleman.secretName" . }}
          {{- end }}

          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if or $mountAgents .Values.extraVolumeMounts }}
          volumeMounts:
          {{- if $mountAgents }}
          - name: agents
            mountPath: {{ .Values.agentsMountPath }}
          {{- range $name, $_ := $agents }}
          - name: agent-{{ include "gentleman.agentId" $name }}
            mountPath: {{ printf "%s/%s" (trimSuffix "/" $.Values.agentsMountPath) $name | quote }}
            readOnly: true
          {{- end }}
          {{- range $name, $_ := $existing }}
          - name: agent-{{ include "gentleman.agentId" $name }}
            mountPath: {{ printf "%s/%s" (trimSuffix "/" $.Values.agentsMountPath) $name | quote }}
            readOnly: true
          {{- end }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}

      {{- if or $mountAgents .Values.extraVolumes }}
      volumes:
      {{- if $mountAgents }}
      - name: agents
        emptyDir: {}
      {{- range $name, $_ := $agents }}
      - name: agent-{{ include "gentleman.agentId" $name }}
        configMap:
          name: {{ include "gentleman.agentConfigMapName" (dict "root" $ "name" $name) }}
      {{- end }}
      {{- range $name, $configMap := $existing }}
      - name: agent-{{ include "gentleman.agentId" $name }}
        configMap:
          name: {{ $configMap }}
      {{- end }}
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
