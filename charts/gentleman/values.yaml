# Deployment

# Keep a single replica: A2A tasks are kept in memory, in the pod that
# received them, so tasks/get may fail on another replica. See README.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

image:
  repository: ghcr.io/madebyman/gentleman
  pullPolicy: IfNotPresent
  tag: ''

nameOverride: ''
fullnameOverride: ''

## pod
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext: {}

## env

appOrigin: ""

env:
  GENTLEMAN_APP_NAME: Gentleman
  GENTLEMAN_APP_EXPOSE: '["agui","a2a","mcp"]'
  GENTLEMAN_CORS_ALLOW_ORIGINS: '[]'
  GENTLEMAN_REMOTE_MAX_HOP: '8'

extraEnv: []

## probe

# Holds off liveness and readiness until gentleman has started. Startup waits
# for every agent's MCP servers in turn (initTimeout, 30s each by default),
# so allow periodSeconds x failureThreshold for all of them (here 150s).
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http

readinessProbe:
  httpGet:
    path: /ready
    port: http

## resources

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

## 

extraVolumeMounts: []
extraVolumes: []

nodeSelector: {}

affinity: {}

tolerations: []

# Secret

secrets:
  existingSecret: ''

  create: false
  data: {}

# Service

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Ingress

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Traefik — disable response buffering for SSE:
  #   traefik.ingress.kubernetes.io/router.middlewares: <ns>-<middleware>@kubernetescrd
  # AWS ALB — raise the idle timeout above 60s:
  #   alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
  hosts:
  - host: localhost
    paths:
    - path: /
      pathType: Prefix
  tls: []
  # - secretName: gentleman-tls
  #   hosts:
  #   - localhost

# HTTPRoute

httpRoute:
  enabled: false
  annotations: {}

  parentRefs:
    - name: gateway
      sectionName: http

  hostnames: []

  path: /
  pathType: PathPrefix

  # Timeouts for the generated rule. AG-UI streams over SSE, and `request`
  # covers the whole stream, so raise it for long-running agents. Defaults
  # depend on the Gateway implementation. "0s" disables a timeout.
  # Ignored when `rules` is set.
  # timeouts:
  #   request: 300s
  #   backendRequest: 300s
  timeouts: {}

  # Replaces the generated rule entirely (templated).
  rules: []


# ServiceAccount

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "gentleman"

# agents

# Each agent is a directory under agentsMountPath. The chart lays an emptyDir
# there and mounts one ConfigMap per agent on top of it, at <agentsMountPath>/<name>.
agentsMountPath: /app/agents

# Your agents, keyed by agent name. Each holds its files:
# agent.yaml or a2a.yaml, and optionally mcp_config.json (with agent.yaml).
#
#   agents:
#     concierge:
#       agent.yaml:
#         model: gentleman:echo
#         routing:
#           visibility: public
#           delegates: [writer]
#     writer:
#       agent.yaml:
#         model: gentleman:echo
agents: {}

# Agents from ConfigMaps you manage, as `agent name: ConfigMap name`.
# The ConfigMap's keys become the files in that agent's directory:
#
#   kubectl create configmap my-writer --from-file=agents/writer
#
#   existingAgents:
#     writer: my-writer
existingAgents: {}

# Shipped so that `helm install gentleman` works out of the box.
# Used only when agents and existingAgents are both empty.
# Set to null to mount no agents at all.
defaultAgents:
  example:
    agent.yaml:
      model: gentleman:echo
      description: A helpful assistant.
      routing:
        visibility: public
        delegates: []
      metadata:
        version: 1.0.0
      instructions: |
        You are a helpful assistant.

        - Answer the user's questions clearly and concisely.
        - If you are unsure, say so instead of guessing.
        - Use the available tools when they help.

