# Deployment

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

image:
  repository: ghcr.io/madebyman/gentleman
  pullPolicy: IfNotPresent
  tag: ''

nameOverride: ''
fullnameOverride: ''

## pod

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

## env

appOrigin: ""

env:
  GENTLEMAN_APP_NAME: Gentleman
  GENTLEMAN_APP_EXPOSE: '["agui","a2a","mcp"]'
  GENTLEMAN_CORS_ALLOW_ORIGINS: '[]'
  GENTLEMAN_REMOTE_MAX_HOP: '8'

extraEnv: []

## probe

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5

## resources

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

## 

extraVolumeMounts: []
extraVolumes: []

nodeSelector: {}

affinity: {}

tolerations: []

# Secret

secrets:
  existingSecret: ''

  create: false
  data: {}

# Service

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Ingress

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Traefik — disable response buffering for SSE:
  #   traefik.ingress.kubernetes.io/router.middlewares: <ns>-<middleware>@kubernetescrd
  # AWS ALB — raise the idle timeout above 60s:
  #   alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
  hosts:
  - host: localhost
    paths:
    - path: /
      pathType: Prefix
  tls: []
  # - secretName: gentleman-tls
  #   hosts:
  #   - localhost

# ServiceAccount

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "gentleman"

# agents

agentsMountPath: /app/agents

agentsExistingConfigMap: ''

agents:
  example/agent.yaml:
    model: gentleman:echo
    description: A helpful assistant.
    routing:
      visibility: public
      delegates: []
    metadata:
      version: 1.0.0
    instructions: |
      You are a helpful assistant.

      - Answer the user's questions clearly and concisely.
      - If you are unsure, say so instead of guessing.
      - Use the available tools when they help.

