[project]
name = "gentleman-agents"
description = "Declarative AI agent server — MCP for tools, A2A for agents, AG-UI for humans"
keywords = ["ai", "agents", "agent-server", "llm", "pydantic-ai", "mcp", "a2a", "ag-ui"]
version = "0.3.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "masafumi-sasahara", email = "masafumi@sasahara.io" }
]
requires-python = ">=3.14"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Environment :: Web Environment",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

dependencies = [
    "a2a-sdk[http-server]>=1.0.3,<1.1",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "mcp>=2,<3",
    "pydantic-ai-slim[ag-ui,anthropic,bedrock,mcp,openai,spec]>=2.37.0,<3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/madebyman/gentleman"
Repository = "https://github.com/madebyman/gentleman"
Issues = "https://github.com/madebyman/gentleman/issues"

[project.scripts]
gentleman = "gentleman._bin:main"
gentleman-agents = "gentleman._bin:main"

[project.optional-dependencies]
chat = [
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]
all = ["gentleman-agents[chat]"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gentleman"
